name: Validate application

# Three things have to hold before a change lands:
#   1. the Vue frontend type-checks, builds, and passes its own tests,
#   2. the unit tests pass without any infrastructure,
#   3. the integration tests pass against a REAL MySQL and a REAL Redis - the
#      whole point of that suite is to catch what Mockito-based unit tests
#      structurally cannot (see AuthServiceTest vs
#      AuthenticationFlowIntegrationTest).
#
# The integration tests are opt-in locally (`mvn test -Pintegration-test`)
# because they need that infrastructure. In CI it is always there, so they
# always run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` is `vue-tsc -b && vite build`, so this is both the
      # type check and the production build in one step. It covers the spec
      # files too, which is why a badly typed test fails here rather than
      # rotting quietly.
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      # Vitest, in happy-dom: the API client's failure handling, the photo
      # upload retry, the preference store's startup read, and the admin edit
      # form. No browser and no backend, so it runs in seconds.
      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Default profile excludes the "integration" tag, so this run needs no
      # database and stays fast.
      - name: Run unit tests
        working-directory: backend
        run: mvn -B --no-transfer-progress test

  integration-tests:
    name: Backend integration tests (real MySQL + Redis)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: RootLocalPass123!
          MYSQL_DATABASE: bienvenue_blainville_test
          MYSQL_USER: blainville_app
          MYSQL_PASSWORD: DevLocalPass123!
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pRootLocalPass123!"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      # RedisCacheIntegrationTest asserts against real Redis keys - that the
      # cache is keyed by day/sector/horizon, that values round-trip through
      # JSON with their dates intact, and that admin writes evict.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The credentials below match the @DynamicPropertySource block in
      # AuthenticationFlowIntegrationTest, which is what the Spring context
      # actually reads. Flyway migrates V1-V6 on context startup.
      - name: Run integration tests against MySQL and Redis
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: bienvenue_blainville_test
          DB_USERNAME: blainville_app
          DB_PASSWORD: DevLocalPass123!
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: mvn -B --no-transfer-progress test -Pintegration-test
