spring:
  application:
    name: bienvenue-a-blainville
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bienvenue_blainville?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Toronto}
    username: ${DB_USERNAME:blainville_app}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Redis is a read cache in front of the two hot public endpoints, never a
  # source of truth. CACHE_TYPE=none disables caching. Assistant quota checks
  # still require Redis and return 503 if it is unavailable.
  cache:
    type: ${CACHE_TYPE:redis}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Deliberately short: a hung Redis must cost a request milliseconds,
      # not the 60s Lettuce would wait by default. CacheConfig additionally
      # rejects commands outright while the connection is down, so a dead
      # Redis does not even pay this timeout.
      connect-timeout: 500ms
      timeout: 500ms
    # The audit trail's document-store option. Nothing connects at startup, so
    # an unset MongoDB is only a problem if app.audit.store=mongodb.
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/bienvenue_blainville}
      auto-index-creation: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Wait for every in-sync replica. The relay only marks a row published
      # once the broker has acknowledged it, so a weaker ack here would mean
      # marking events sent that a broker failover could still lose.
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    listener:
      # Consumers are idempotent on the event id, so at-least-once redelivery
      # is safe and a missing commit is preferable to a lost event.
      ack-mode: record

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    issuer: bienvenue-a-blainville
    secret: ${APP_JWT_SECRET:change-this-development-secret-change-before-production}
    expires-in-minutes: 1440
  admin:
    email: ${APP_ADMIN_EMAIL:admin@blainville.local}
    password: ${APP_ADMIN_PASSWORD:change-this-development-admin-password}
  assistant:
    # `template` answers straight from the retrieved guide entries - no API key,
    # no cost, works on a fresh clone. Set provider=anthropic and export
    # ANTHROPIC_API_KEY to have Claude do the wording instead; the retrieved
    # entries stay the only facts either one is allowed to use.
    provider: ${ASSISTANT_PROVIDER:template}
    model: ${ASSISTANT_MODEL:claude-opus-5}
    api-key: ${ANTHROPIC_API_KEY:}
    rate-limit:
      # This is the only endpoint that can spend money per request, and it is
      # unauthenticated. Counted per IP in Redis; see AssistantRateLimiter.
      requests-per-hour: ${ASSISTANT_RATE_LIMIT:30}
  audit:
    # `mysql` (default) stores the trail in a JSON column of the database this
    # app already runs; `mongodb` uses the document store. Same interface,
    # same tests - see AuditStore for when each one earns its place.
    store: ${AUDIT_STORE:mysql}
  events:
    # The outbox always records, with or without a broker - it is a plain
    # insert in the business transaction. This switch controls only the relay
    # and the consumers, so a deployment without Kafka keeps its events on the
    # table rather than losing them.
    enabled: ${EVENTS_ENABLED:true}
    relay:
      interval-ms: ${EVENTS_RELAY_INTERVAL_MS:1000}
  collection:
    put-out-after: "20:00"
    put-out-before: "06:00"
    bring-back-before: "20:00"
