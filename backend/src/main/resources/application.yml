spring:
  application:
    name: bienvenue-a-blainville
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bienvenue_blainville?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Toronto}
    username: ${DB_USERNAME:blainville_app}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Redis is a read cache in front of the two hot public endpoints, never a
  # source of truth. CACHE_TYPE=none disables caching. Assistant quota checks
  # still require Redis and return 503 if it is unavailable.
  cache:
    type: ${CACHE_TYPE:redis}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Deliberately short: a hung Redis must cost a request milliseconds,
      # not the 60s Lettuce would wait by default. CacheConfig additionally
      # rejects commands outright while the connection is down, so a dead
      # Redis does not even pay this timeout.
      connect-timeout: 500ms
      timeout: 500ms
    # The audit trail's document-store option. Nothing connects at startup, so
    # an unset MongoDB is only a problem if app.audit.store=mongodb.
    mongodb:
      # serverSelectionTimeoutMS: the driver waits 30 seconds by default before
      # admitting nothing is listening. MongoDB is optional here - the audit
      # trail falls back to MySQL and the query log is analytics - so a missing
      # one must fail fast rather than hold anything for half a minute.
      uri: ${MONGODB_URI:mongodb://localhost:27017/bienvenue_blainville?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}
      auto-index-creation: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Wait for every in-sync replica. The relay only marks a row published
      # once the broker has acknowledged it, so a weaker ack here would mean
      # marking events sent that a broker failover could still lose.
      acks: all
      properties:
        # Kafka's default is 60 SECONDS. `send()` blocks for this long when
        # broker metadata is unavailable, so an unreachable broker would hold
        # the calling thread - and the resident-query stream is published from
        # inside a request. One second is plenty for a healthy broker and
        # bounded enough that an unhealthy one costs a resident almost nothing.
        max.block.ms: 1000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    listener:
      # Consumers are idempotent on the event id, so at-least-once redelivery
      # is safe and a missing commit is preferable to a lost event.
      ack-mode: record

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  cors:
    # Origins the browser may call this API from, comma separated. The default
    # is the Vite dev server, so a fresh clone needs nothing; a deployment sets
    # this to the domain the site is served from, or the API will refuse the
    # browser it exists for.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    issuer: bienvenue-a-blainville
    secret: ${APP_JWT_SECRET:change-this-development-secret-change-before-production}
    expires-in-minutes: 1440
  admin:
    email: ${APP_ADMIN_EMAIL:admin@blainville.local}
    password: ${APP_ADMIN_PASSWORD:change-this-development-admin-password}
  assistant:
    # `template` answers straight from the retrieved guide entries - no API key,
    # no cost, works on a fresh clone. Set provider=anthropic and export
    # ANTHROPIC_API_KEY to have Claude do the wording instead; the retrieved
    # entries stay the only facts either one is allowed to use.
    provider: ${ASSISTANT_PROVIDER:template}
    model: ${ASSISTANT_MODEL:claude-opus-5}
    api-key: ${ANTHROPIC_API_KEY:}
    rate-limit:
      # This is the only endpoint that can spend money per request, and it is
      # unauthenticated. Counted per IP in Redis; see AssistantRateLimiter.
      requests-per-hour: ${ASSISTANT_RATE_LIMIT:30}
  audit:
    # `mysql` (default) stores the trail in a JSON column of the database this
    # app already runs; `mongodb` uses the document store. Same interface,
    # same tests - see AuditStore for when each one earns its place.
    store: ${AUDIT_STORE:mysql}
  events:
    # The outbox always records, with or without a broker - it is a plain
    # insert in the business transaction. This switch controls only the relay
    # and the consumers, so a deployment without Kafka keeps its events on the
    # table rather than losing them.
    enabled: ${EVENTS_ENABLED:true}
    relay:
      interval-ms: ${EVENTS_RELAY_INTERVAL_MS:1000}
  photo:
    # Resident photo uploads. Credentials come from the AWS default chain -
    # environment, container role, instance profile - so no key is configured
    # here or committed. Set an endpoint to point at a local S3 for tests.
    bucket: ${PHOTO_BUCKET:blainville-resident-photos}
    region: ${AWS_REGION:ca-central-1}
    endpoint: ${S3_ENDPOINT:}
    upload-ttl: ${PHOTO_UPLOAD_TTL:300}
    max-upload-bytes: ${PHOTO_MAX_BYTES:10000000}
    # The Lambda is triggered asynchronously by the upload, so an answer asked
    # for straight afterwards has to wait for it. Bounded: past this the
    # resident is told to try again rather than held indefinitely.
    processing-timeout: ${PHOTO_PROCESSING_TIMEOUT:10}
  collection:
    calendar:
      # The recurring collections are stored as patterns, not as rows with an
      # end date, and materialized out to this horizon on startup and daily.
      # Turning this off freezes the calendar at whatever is already in the
      # database - which is what the old hand-written seed did by accident.
      enabled: ${COLLECTION_CALENDAR_TOP_UP:true}
      horizon-days: ${COLLECTION_CALENDAR_HORIZON_DAYS:180}
      interval-ms: ${COLLECTION_CALENDAR_INTERVAL_MS:86400000}
