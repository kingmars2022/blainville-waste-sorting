services:
  mysql:
    image: mysql:8.4
    container_name: bienvenue-blainville-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bienvenue_blainville}
      MYSQL_USER: ${DB_USERNAME:-blainville_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: America/Toronto
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bienvenue-blainville-redis
    restart: unless-stopped
    # maxmemory + LRU: the cache must never be the thing that runs the host
    # out of memory. Entries here are all rebuildable from MySQL.
    command: ["redis-server", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: bienvenue-blainville-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      # started, not healthy: the app boots and serves fine without Redis,
      # so a slow cache must not hold up the API.
      redis:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-bienvenue_blainville}?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Toronto&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-blainville_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@blainville.local}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TYPE: ${CACHE_TYPE:-redis}
      TZ: America/Toronto
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  mysql_data:

