services:
  mysql:
    image: mysql:8.4
    container_name: bienvenue-blainville-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bienvenue_blainville}
      MYSQL_USER: ${DB_USERNAME:-blainville_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: America/Toronto
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bienvenue-blainville-redis
    restart: unless-stopped
    # Quota counters share this instance with caches: never evict counters.
    # At capacity, cache writes fail open and assistant quotas fail closed.
    command: ["redis-server", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: bienvenue-blainville-kafka
    restart: unless-stopped
    # KRaft mode: no ZooKeeper. One broker that is also its own controller,
    # which is the right size for a single-machine development stack.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-9092}:9092"

  mongo:
    image: mongo:7
    container_name: bienvenue-blainville-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: bienvenue-blainville-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      # started, not healthy: the app boots and serves fine without Redis,
      # so a slow cache must not hold up the API.
      redis:
        condition: service_started
      # Same reasoning: the outbox records events into MySQL whether or not a
      # broker is up, and the audit trail defaults to MySQL. Neither is allowed
      # to delay the API.
      kafka:
        condition: service_started
      mongo:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-bienvenue_blainville}?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Toronto&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-blainville_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@blainville.local}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TYPE: ${CACHE_TYPE:-redis}
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-template}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-opus-5}
      # Empty by default: the assistant works without it. Supply your own key
      # in .env (git-ignored) to have Claude do the wording.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_RATE_LIMIT: ${ASSISTANT_RATE_LIMIT:-30}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGODB_URI: mongodb://mongo:27017/bienvenue_blainville
      EVENTS_ENABLED: ${EVENTS_ENABLED:-true}
      AUDIT_STORE: ${AUDIT_STORE:-mysql}
      TZ: America/Toronto
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  mysql_data:
  mongo_data:
